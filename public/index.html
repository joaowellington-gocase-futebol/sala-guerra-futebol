<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sala de Guerra do Futebol</title>
<link rel="stylesheet" href="/escritorio.css" />
</head>
<body>

<header class="topo">
  <h1>⚽ Sala de Guerra do Futebol</h1>
  <p class="subtitulo">A agência interna de futebol da Gocase — 9 agentes de IA, uma mesa só.</p>
  <div class="topo-status" id="statusToken"></div>
</header>

<main class="layout">

  <section class="escritorio-wrap">
    <div class="escritorio" id="escritorio">
      <!-- mesas e bonequinhos são criados por escritorio.js -->
      <div class="mesa-reuniao" id="mesaReuniao"><span>Mesa de Reunião</span></div>
      <div class="cantinho-motivacional" id="cantinho"><span>Cantinho do Motivacional</span></div>
    </div>
  </section>

  <section class="painel-lateral" id="painelLateral" hidden>
    <button class="fechar" id="fecharPainel">✕</button>
    <div id="painelConteudo"></div>
  </section>

</main>

<section class="reuniao-bar">
  <input id="temaReuniao" type="text" placeholder="Tema da reunião (ex.: Clássico Ceará x Fortaleza, ou um lançamento)" />
  <input id="sessaoReuniao" type="text" placeholder="sessão (ex.: ceara-2027-home)" style="max-width:220px" />
  <button id="btnConvocar">📣 Convocar reunião</button>
  <span id="reuniaoStatus"></span>
</section>

<section class="transcricao" id="transcricao" hidden>
  <div class="transcricao-topo">
    <strong>Transcrição da reunião</strong>
    <button id="fecharTranscricao">✕</button>
  </div>
  <div id="transcricaoConteudo"></div>
</section>

<script src="/escritorio.js"></script>
<script src="/mesa-de-trabalho.js"></script>
</body>
</html>
