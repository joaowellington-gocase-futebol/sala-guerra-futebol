<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sala de Guerra do Futebol</title>
<link rel="icon" type="image/svg+xml" href="/squad-patch.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/sala.css" />
</head>
<body>

<header class="hud">
  <div class="titulo">
    <img class="brasao" src="/squad-patch.svg" alt="Brasão do squad de futebol" />
    <h1>SALA DE GUERRA DO FUTEBOL</h1>
    <img class="brasao" src="/squad-patch.svg" alt="" aria-hidden="true" />
  </div>
  <div class="hud-linha">
    <span id="contagem">próxima reunião automática em —</span>
    <span class="sep">·</span>
    <span>Téo · Rafa · Nina · Caio · Val — sua equipe de 5</span>
  </div>
  <div id="avisos" class="avisos"></div>
</header>

<div class="sala-wrap">
  <div class="moldura">
    <div class="tela">
      <canvas id="sala"></canvas>
      <div id="camadaUi"></div>
      <div class="scanlines" aria-hidden="true"></div>
    </div>
    <div id="legenda" class="legenda"></div>
  </div>
</div>

<div class="faixa-ata" id="faixaAta"></div>

<div class="barra">
  <input id="campoTema" type="text" placeholder="Tema da reunião (vazio = a mesa escolhe a pauta pelo dado da hora)" />
  <input id="campoSessao" type="text" class="curto" placeholder="sessão (opcional)" />
  <label class="check"><input type="checkbox" id="mandarWebhook" /> mandar no webhook</label>
  <button id="btnConvocar" class="pixel">📣 Convocar reunião</button>
  <button id="btnDirecao" class="pixel">🎯 Coordenar</button>
  <button id="btnAutomatica" class="pixel secundaria">🤖 Rodar a automática agora</button>
  <button id="btnAtas" class="pixel secundaria">📜 Reuniões</button>
  <button id="btnMemoria" class="pixel secundaria">🧠 Memória</button>
  <button id="btnBoletim" class="pixel secundaria">📊 Boletim</button>
  <button id="btnCorredor" class="pixel secundaria">☕ Corredor</button>
  <button id="btnConfig" class="pixel secundaria">⚙ Config</button>
  <span id="statusBarra" class="status"></span>
</div>

<aside id="painel" class="painel">
  <button class="fechar" id="fecharPainel">✕</button>
  <div id="painelConteudo"></div>
</aside>

<script type="module" src="/painel.js"></script>
</body>
</html>
